services:
  # Backend FastAPI Service
  - type: web
    name: catalogiq-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catalogiq-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

# PostgreSQL Database
databases:
  - name: catalogiq-db
    databaseName: catalogiq
    plan: free
    region: singapore
